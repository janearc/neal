[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neal"
version = "0.0.1"
description = "Turns dictated narration into a durable, provenance-tracked story graph. Memory and synthesis only — the writer writes."
# 3.12 to match the fleet and the good-citizen client (which requires >=3.12).
requires-python = ">=3.12"
dependencies = [
    # The deterministic, model-free prepass leans on wonderlib (markdown→XML +
    # lexical rarity profiling → candidate node vocabulary). Pinned to the public
    # package, not a local path — re-sync by bumping this reference.
    "wonderlib @ git+https://github.com/janearc/wonderlib.git",
    # The fleet's frood + birblib surface: the model client (resolves models through
    # delightd discovery, fail-closed) and the birb archetype layer (BirbBento, Manifest,
    # BirbHandlers, the FSM lifecycle). Pinned to the same big-little-mesh rev magpie uses
    # (the good_citizen->frood rename merge); bump deliberately when the surface changes.
    "big-little-mesh-frood @ git+https://github.com/janearc/big-little-mesh.git@acb1ed92c4bf346ff0e23b5443511d2a54ce3962#subdirectory=python",
]

[project.scripts]
neal = "neal.cli:main"

# dev-only: the regression suite + linter. neither is a runtime dependency -- neal
# ships without them. install with `uv sync --group dev`.
[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

# ruff: the lint gate. line-length matches the fleet (magpie/paling) at 100.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes (the bug-catching core); B = bugbear (real bug
# patterns); N = pep8-naming; T201 = no stray print() in library code.
select = ["E", "F", "B", "N", "T201"]

[tool.ruff.lint.per-file-ignores]
# the CLI's stdout IS the product (the bento id / candidate count); print() is correct.
"neal/cli.py" = ["T201"]
# the lint tools report their findings to stdout/stderr -- printing is the whole point.
"tools/**/*.py" = ["T201"]

# coverage: measure the neal package only; the CI step enforces an 80% floor
# (we sit ~94%). source-scoped so test files and tooling don't pad the number.
[tool.coverage.run]
source = ["neal"]

[tool.hatch.metadata]
# Required to allow the direct git reference to wonderlib above.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["neal"]
