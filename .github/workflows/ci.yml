name: ci

# neal's gate, the fleet pattern (magpie/paling). Unlike magpie (whose mlx-whisper
# pins it to Apple Silicon), neal has no arch-bound dependency, so CI runs on ubuntu,
# Python 3.12, installed via uv from uv.lock (the repo's lock of record).
#
# The gate runs exactly what a developer runs locally, in order:
#   - ruff           lint (config in pyproject.toml: select E,F,B,N,T201 @ 100 cols)
#   - no_docstrings  the house docstring ban (standards §4) -- ruff cannot express it
#   - pytest         the full suite
#
# The prepass's real wonderlib path needs the spacy en_core_web_sm model, which CI
# does not download; that one smoke test skips here and is covered locally. Every
# other test injects a fake profiler, so the suite gates the orchestration without
# the model.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project (uv sync)
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uv run ruff check neal tests tools

      - name: Bounce docstrings (standards §4)
        run: uv run python tools/lint/no_docstrings.py neal tests tools

      - name: Test (pytest)
        run: uv run pytest ./tests
